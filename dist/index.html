<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Mars and Moon Explorer</title>
    <script type="module" crossorigin src="/Spaceapps-Project-/assets/home-DUTvrL5B.js"></script>
    <link rel="modulepreload" crossorigin href="/Spaceapps-Project-/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="stylesheet" crossorigin href="/Spaceapps-Project-/assets/home-BYFjd50_.css">
  </head>
  <body>
    <main aria-label="Interactive view of Mars">
      <nav class="planet-switch" aria-label="Choose a celestial body">
        <button class="is-active" type="button" data-planet="mars" aria-pressed="true">Mars</button>
        <button type="button" data-planet="moon" aria-pressed="false">Moon</button>
      </nav>
      <canvas id="mars-canvas" aria-label="Mars in space. Drag to rotate and scroll to zoom."></canvas>
      <div class="controls" aria-label="Zoom controls">
        <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      </div>
    </main>
  </body>
</html>
