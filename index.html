<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23B64D32'/%3E%3Cpath d='M7 37c14-7 30 7 50-8' fill='none' stroke='%23E47A45' stroke-width='6'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Mars and Moon Explorer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main aria-label="Interactive view of Mars">
      <nav class="planet-switch" aria-label="Choose a celestial body">
        <button class="is-active" type="button" data-planet="mars" aria-pressed="true">Mars</button>
        <button type="button" data-planet="moon" aria-pressed="false">Moon</button>
      </nav>

      <canvas
        id="mars-canvas"
        aria-label="Mars in space. Drag to rotate and scroll to zoom."
      ></canvas>

      <div class="controls" aria-label="Zoom controls">
        <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      </div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
